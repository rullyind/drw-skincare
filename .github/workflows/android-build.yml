name: Build Mbicuki Catur Android

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  ANDROID_TARGET_SDK: '36'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Prepare web bundle
        run: |
          rm -rf dist
          mkdir -p dist
          cp chess.html dist/index.html
          cp chess.css dist/chess.css
          cp chess.js dist/chess.js
          cp chess-account.js dist/chess-account.js
          cp chess-features.js dist/chess-features.js
          cp chess-matchmaking.js dist/chess-matchmaking.js
          cp firebase-config.js dist/firebase-config.js
          if [ -d assets ]; then cp -R assets dist/; fi

      - name: Prepare Android platform
        run: rm -rf android

      - name: Add Capacitor Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Gradle cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Configure Android app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('>', '>\n    <uses-permission android:name="android.permission.INTERNET" />', 1)
          manifest.write_text(s)

          for name in ['android/variables.gradle', 'android/app/variables.gradle']:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text()
              text = re.sub(r'(?m)^([ \t]*)(compileSdkVersion|compileSdk)\s*=.*$', r'\g<1>\2 = 36', text)
              text = re.sub(r'(?m)^([ \t]*)(targetSdkVersion|targetSdk)\s*=.*$', r'\g<1>\2 = 36', text)
              p.write_text(text)
          PY

      - name: Apply Mbicuki launcher icon
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          ICON='Logo Mbicuki Catur Online.png'
          test -f "$ICON"
          BASE='android/app/src/main/res'
          command -v convert
          for spec in 'mipmap-mdpi:48' 'mipmap-hdpi:72' 'mipmap-xhdpi:96' 'mipmap-xxhdpi:144' 'mipmap-xxxhdpi:192'; do
            DIR="${spec%%:*}"
            SIZE="${spec##*:}"
            mkdir -p "$BASE/$DIR"
            convert "$ICON" -auto-orient -resize "${SIZE}x${SIZE}" -background none -gravity center -extent "${SIZE}x${SIZE}" "$BASE/$DIR/ic_launcher.png"
            cp "$BASE/$DIR/ic_launcher.png" "$BASE/$DIR/ic_launcher_round.png"
          done

      - name: Check signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'All Android signing secrets are configured.'
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Android signing secrets are not configured.'
          fi

      - name: Configure release signing
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          raw = os.environ['ANDROID_KEYSTORE_BASE64'].strip()
          if raw.startswith('"') and raw.endswith('"'):
              raw = raw[1:-1]
          if raw.startswith("'") and raw.endswith("'"):
              raw = raw[1:-1]
          if raw.startswith('data:') and ',' in raw:
              raw = raw.split(',', 1)[1]
          raw = ''.join(raw.split())
          raw = raw.replace('-', '+').replace('_', '/')
          raw += '=' * (-len(raw) % 4)
          try:
              data = base64.b64decode(raw, validate=True)
          except Exception as exc:
              raise SystemExit('ANDROID_KEYSTORE_BASE64 is not valid Base64. Recreate it directly from the .jks file and paste only the Base64 text into the GitHub secret.') from exc
          if not data:
              raise SystemExit('ANDROID_KEYSTORE_BASE64 decoded to an empty file.')
          Path('android/app/mbicuki-upload-key.jks').write_bytes(data)
          print(f'Keystore decoded successfully ({len(data)} bytes).')
          PY
          test -s android/app/mbicuki-upload-key.jks

          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          if 'signingConfigs {' not in text:
              signing_block = '''\n    signingConfigs {\n        release {\n            storeFile file("mbicuki-upload-key.jks")\n            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n        }\n    }\n'''
              marker = '\n    buildTypes {'
              if marker not in text:
                  raise SystemExit('Could not locate buildTypes block in android/app/build.gradle')
              text = text.replace(marker, signing_block + marker, 1)
          if 'signingConfig signingConfigs.release' not in text:
              build_types = text.find('\n    buildTypes {')
              if build_types < 0:
                  raise SystemExit('Could not locate buildTypes block')
              release = text.find('\n        release {', build_types)
              if release < 0:
                  raise SystemExit('Could not locate buildTypes.release block')
              insert_at = release + len('\n        release {')
              text = text[:insert_at] + '\n            signingConfig signingConfigs.release' + text[insert_at:]
          p.write_text(text)
          PY

      - name: Verify keystore credentials
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if ! keytool -list -v -keystore android/app/mbicuki-upload-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -keypass "$ANDROID_KEY_PASSWORD" >/dev/null 2>&1; then
            echo 'ERROR: Keystore was decoded, but the password/alias/key password do not match the keystore.'
            echo 'Check ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD.'
            echo 'For the keystore created with alias mbicuki, ANDROID_KEY_ALIAS must be exactly: mbicuki'
            exit 1
          fi
          echo 'Keystore credentials verified successfully.'

      - name: Verify release signing configuration
        if: steps.signing.outputs.configured == 'true'
        run: |
          test -s android/app/mbicuki-upload-key.jks
          grep -q 'signingConfig signingConfigs.release' android/app/build.gradle
          echo 'Release signing configuration is ready.'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: mbicuki-catur-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build signed release bundle
        if: steps.signing.outputs.configured == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Fail when signing is not configured
        if: steps.signing.outputs.configured != 'true'
        run: |
          echo 'ERROR: Android release signing secrets are not configured.'
          echo 'Required secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD'
          exit 1

      - name: Verify signed release bundle exists
        run: |
          AAB=$(find android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)
          test -n "$AAB"
          test -s "$AAB"
          echo "Signed AAB created: $AAB"

      - name: Upload signed release bundle
        uses: actions/upload-artifact@v6
        with:
          name: mbicuki-catur-signed-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Cleanup signing material
        if: always()
        run: rm -f android/app/mbicuki-upload-key.jks
