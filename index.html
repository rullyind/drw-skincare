<!DOCTYPE html>
<html lang="id">
<head>

body{
    margin:0;
    font-family:Arial;
    background:#fafafa;

    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DRW SKINCARE</title>

<style>

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
}

#cart-icon{
    background:white;
    color:#ff2b7a;
    padding:10px 18px;
    border-radius:30px;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

#cart-icon:hover{
    background:#ffe4ef;
}
}

    background:#ff2d75;
    color:white;
}

.banner{
    background:linear-gradient(90deg,#ff5f9e,#ffbad4);
    padding:70px;
    text-align:center;
    color:white;
}

.produk{
    padding:50px;
    text-align:center;
}

.card{
    display:inline-block;
    width:260px;
    background:white;
    margin:15px;
    border-radius:15px;
    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.card img{
    width:180px;
}

.nama{
    font-size:22px;
    font-weight:bold;
}

.harga{
    color:#ff2d75;
    font-size:24px;
    margin:15px;
}

button{
    background:#ff2d75;
    color:white;
    border:none;
    padding:15px 35px;
    border-radius:30px;
    cursor:pointer;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:50px;
}
/* CSS lainnya */

</style>

</head>
<script>
let cart = [];

function tambahKeranjang(nama, harga){

    cart.push({
        nama:nama,
        harga:harga
    });

    document.getElementById("cart-count").innerHTML = cart.length;

    tampilKeranjang();
}

function tampilKeranjang(){

    if(cart.length==0){
        document.getElementById("cartList").innerHTML="Belum ada produk.";
        return;
    }

    let html="";
    let total=0;

    cart.forEach(function(item){

        html += `
            <p>${item.nama} - Rp${item.harga.toLocaleString("id-ID")}</p>
        `;

        total += item.harga;

    });

    html += `
        <hr>
        <h3>Total : Rp${total.toLocaleString("id-ID")}</h3>
    `;

    document.getElementById("cartList").innerHTML = html;

}
</script>
<body>

<header>

    <h1>DRW SKINCARE</h1>

    <div id="cart-icon">
        🛒 <span id="cart-count">0</span>
    </div>

</header>

<div class="banner">

<h1>Kulit Cantik Dimulai dari Perawatan Terbaik</h1>

<p>Produk Skincare Asli Indonesia</p>

<button>Lihat Produk</button>

</div>

<div class="produk">

<h2>Produk Unggulan</h2>

<div class="card">

<img src="images/sb acne 2026.png" alt="Radiant Glow Booster">

<div class="nama">
Sunscreen Oily Acne
</div>

<div class="harga">
Rp125.000
</div>

<button onclick="tambahKeranjang('Sunscreen Oily Acne',125000)">
Tambah Keranjang
</button>


</div>

<div class="card">

<img src="images/24ae97d7-a6f4-4cf1-9648-b0792e285389.png" alt="BB Cushion">  

<div class="nama">
Day Cream Acne 1
</div>

<div class="harga">
Rp95.000
</div>

<button onclick="tambahKeranjang('Day Cream Acne 1',95000)">
Tambah Keranjang
</button>

</div>

</div>
<div style="
max-width:700px;
margin:40px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
">

<h2>🛒 Keranjang</h2>

<div id="cartList">
Belum ada produk.
</div>

</div>
<footer>

© 2026 DRW SKINCARE

</footer>

</body>
</html>
