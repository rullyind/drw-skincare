<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DRW SKINCARE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#fafafa;
}

/* HEADER */

header{
    background:#ff2d75;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
}

header h1{
    font-size:35px;
}

#cart-icon{
    background:white;
    color:#ff2d75;
    padding:12px 20px;
    border-radius:30px;
    font-weight:bold;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

/* BANNER */

.banner{
    background:linear-gradient(90deg,#ff5f9e,#ffbad4);
    color:white;
    text-align:center;
    padding:80px 20px;
}

.banner h1{
    font-size:45px;
    margin-bottom:15px;
}

.banner p{
    font-size:20px;
    margin-bottom:30px;
}

.banner button{
    background:#ff2d75;
    color:white;
    border:none;
    padding:15px 35px;
    border-radius:30px;
    cursor:pointer;
    font-size:18px;
}

/* PRODUK */

.produk{
    padding:60px;
    text-align:center;
}

.produk h2{
    margin-bottom:40px;
}

.card{
    width:260px;
    display:inline-block;
    background:white;
    margin:15px;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.card img{
    width:180px;
}

.nama{
    font-size:24px;
    font-weight:bold;
    margin-top:15px;
}

.harga{
    color:#ff2d75;
    font-size:28px;
    margin:20px 0;
}

.card button{
    width:100%;
    background:#ff2d75;
    color:white;
    border:none;
    padding:15px;
    border-radius:30px;
    cursor:pointer;
}

/* KERANJANG */

#keranjang{
    max-width:700px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

#keranjang h2{
    margin-bottom:20px;
}

.item{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

.total{
    margin-top:20px;
    border-top:1px solid #ddd;
    padding-top:15px;
    font-size:22px;
    font-weight:bold;
}

/* FOOTER */

footer{
    margin-top:60px;
    background:#222;
    color:white;
    text-align:center;
    padding:25px;
}

</style>
</head>

<body>

<header>

<h1>DRW SKINCARE</h1>

<div id="cart-icon">
🛒 <span id="cart-count">0</span>
</div>

</header>

<section class="banner">

<h1>Kulit Cantik Dimulai dari Perawatan Terbaik</h1>

<p>Produk Skincare Asli Indonesia</p>

<button>Lihat Produk</button>

</section>

<section class="produk">

<h2>Produk Unggulan</h2>

<div class="card">

<img src="images/sb acne 2026.png">

<div class="nama">
Sunscreen Oily Acne
</div>

<div class="harga">
Rp125.000
</div>

<button onclick="tambahKeranjang('Sunscreen Oily Acne',125000)">
Tambah Keranjang
</button>

</div>

<div class="card">

<img src="images/24ae97d7-a6f4-4cf1-9648-b0792e285389.png">

<div class="nama">
Day Cream Acne 1
</div>

<div class="harga">
Rp95.000
</div>

<button onclick="tambahKeranjang('Day Cream Acne 1',95000)">
Tambah Keranjang
</button>

</div>

</section>

<section id="keranjang">

<h2>🛒 Keranjang</h2>

<div id="cartList">
Belum ada produk.
</div>

</section>

<footer>

© 2026 DRW SKINCARE

</footer>

<script>

let cart=[];

function tambahKeranjang(nama,harga){

    cart.push({
        nama:nama,
        harga:harga
    });

    document.getElementById("cart-count").textContent=cart.length;

    tampilKeranjang();

}

function tampilKeranjang(){

    const cartList=document.getElementById("cartList");

    if(cart.length===0){

        cartList.innerHTML="Belum ada produk.";
        return;

    }

    let html="";
    let total=0;

    cart.forEach(function(item){

        html+=`
        <div class="item">
            <span>${item.nama}</span>
            <span>Rp${item.harga.toLocaleString("id-ID")}</span>
        </div>
        `;

        total+=item.harga;

    });

    html+=`
    <div class="total">
        Total : Rp${total.toLocaleString("id-ID")}
    </div>
    `;

    cartList.innerHTML=html;

}

</script>

</body>
</html>
