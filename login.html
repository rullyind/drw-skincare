<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | DRW Skincare</title>

    <link
        rel="icon"
        href="assets/images/favicon.png">

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff7fb,
                    #ffe8f4,
                    #fff
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .auth-card {

            width: 100%;

            max-width: 430px;

            background: rgba(
                255,
                255,
                255,
                0.96
            );

            border-radius: 28px;

            padding: 40px 32px;

            box-shadow:
                0 20px 60px
                rgba(230, 55, 140, 0.18);

            border:
                1px solid
                rgba(230, 55, 140, 0.12);

        }


        .brand {

            text-align: center;

            color: #e73591;

            font-weight: 700;

            letter-spacing: 3px;

            font-size: 14px;

            margin-bottom: 10px;

        }


        h1 {

            text-align: center;

            margin:
                0 0 8px;

            color: #422033;

            font-family:
                Georgia,
                serif;

        }


        .subtitle {

            text-align: center;

            color: #8b6878;

            margin-bottom: 30px;

        }


        .form-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            color: #54283f;

            font-weight: 600;

            font-size: 14px;

        }


        input {

            width: 100%;

            padding: 14px 16px;

            border-radius: 14px;

            border:
                1px solid
                #ecc8d9;

            outline: none;

            font-size: 15px;

        }


        input:focus {

            border-color:
                #e73591;

            box-shadow:
                0 0 0 4px
                rgba(231, 53, 145, 0.10);

        }


        button {

            width: 100%;

            border: 0;

            padding: 15px;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #e73591,
                    #d92b80
                );

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 25px
                rgba(231, 53, 145, 0.25);

        }


        button:hover {

            transform: translateY(-1px);

        }


        .auth-message {

            display: none;

            margin-bottom: 18px;

            padding: 12px 14px;

            border-radius: 12px;

            font-size: 14px;

            text-align: center;

        }


        .auth-message.error {

            display: block;

            background: #fff0f3;

            color: #b42345;

        }


        .auth-message.success {

            display: block;

            background: #edfff5;

            color: #087443;

        }


        .switch {

            text-align: center;

            margin-top: 25px;

            color: #795a69;

            font-size: 14px;

        }


        .switch a {

            color: #e73591;

            font-weight: 700;

            text-decoration: none;

        }

    </style>

</head>


<body>


    <main class="auth-card">

        <div class="brand">
            ✦ DRW SKINCARE ✦
        </div>


        <h1>
            Selamat Datang
        </h1>


        <div class="subtitle">
            Masuk ke akun DRW Skincare Anda
        </div>


        <div
            id="auth-message"
            class="auth-message">
        </div>


        <form id="login-form">

            <div class="form-group">

                <label for="login-email">
                    Email
                </label>

                <input
                    type="email"
                    id="login-email"
                    placeholder="Masukkan email"
                    autocomplete="email"
                    required>

            </div>


            <div class="form-group">

                <label for="login-password">
                    Password
                </label>

                <input
                    type="password"
                    id="login-password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required>

            </div>


            <button type="submit">
                Login
            </button>

        </form>


        <div class="switch">

            Belum punya akun?

            <a href="register.html">
                Daftar sekarang
            </a>

        </div>


    </main>


    <script
        type="module"
        src="assets/js/auth.js">
    </script>

<script src="products-data.js"></script>

</body>

</html>
