<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Produk | RARA DRW Skincare</title>

    <!-- GOOGLE FONT -->
    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
        href="assets/css/style.css">

    <style>

        /* =========================================
           PRODUCTS PAGE
        ========================================= */

        .products-page {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 20% 30%,
                    rgba(255, 95, 166, .08),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 50%,
                    rgba(255, 210, 120, .08),
                    transparent 35%
                ),
                #fff;
        }

        /* =========================================
           HERO
        ========================================= */

        .products-hero {
            padding: 105px 20px 55px;
            text-align: center;
        }

        .products-eyebrow {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #a44b72;
            margin-bottom: 15px;
        }

        .products-title {
            margin: 0;

            font-family:
                "Playfair Display",
                serif;

            font-size:
                clamp(42px, 5vw, 72px);

            line-height: 1.1;
            color: #21191e;
        }

        .products-title span {
            color: #ec4f93;
        }

        .products-subtitle {
            max-width: 760px;
            margin: 22px auto 0;

            color: #846d78;

            font-size: 16px;
            line-height: 1.8;
        }

        /* =========================================
           TOOLBAR
        ========================================= */

        .products-toolbar {
            max-width: 1200px;
            margin: 0 auto;

            padding:
                0 20px 35px;
        }

        .products-search {
            max-width: 600px;
            margin: 0 auto 28px;

            position: relative;
        }

        .products-search i {
            position: absolute;
            left: 20px;
            top: 50%;

            transform:
                translateY(-50%);

            color: #ec4f93;
        }

        .products-search input {

            width: 100%;

            box-sizing: border-box;

            padding:
                17px 20px 17px 52px;

            border:
                1px solid
                rgba(236, 79, 147, .22);

            border-radius: 50px;

            outline: none;

            background:
                rgba(255,255,255,.9);

            color: #33262d;

            font-family:
                "DM Sans",
                sans-serif;

            font-size: 14px;

            box-shadow:
                0 10px 35px
                rgba(236,79,147,.08);

            transition: .3s ease;
        }

        .products-search input:focus {

            border-color:
                #ec4f93;

            box-shadow:
                0 10px 35px
                rgba(236,79,147,.16);
        }

        /* =========================================
           CATEGORY
        ========================================= */

        .category-filter {

            display: flex;

            justify-content:
                center;

            align-items: center;

            flex-wrap: wrap;

            gap: 10px;
        }

        .category-btn {

            border: none;

            padding:
                12px 20px;

            border-radius: 30px;

            background:
                #fff;

            color:
                #6e5360;

            border:
                1px solid
                rgba(236,79,147,.20);

            cursor: pointer;

            font-family:
                "DM Sans",
                sans-serif;

            font-size: 13px;
            font-weight: 700;

            transition: .3s ease;
        }

        .category-btn:hover,
        .category-btn.active {

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #ef4f96,
                    #d92d78
                );

            border-color:
                transparent;

            box-shadow:
                0 10px 25px
                rgba(236,79,147,.25);

            transform:
                translateY(-2px);
        }

        /* =========================================
           PRODUCT AREA
        ========================================= */

        .products-section {

            max-width: 1400px;

            margin: 0 auto;

            padding:
                20px 30px 100px;
        }

        .products-info {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 25px;

            color: #806b75;

            font-size: 14px;
        }

        #productCount {

            font-weight: 700;

            color: #ec4f93;
        }

        /* =========================================
           PRODUCT GRID
        ========================================= */

        #productGrid {

            display: grid;

            grid-template-columns:
                repeat(
                    4,
                    minmax(0, 1fr)
                );

            gap: 26px;
        }

        /* =========================================
           PRODUCT CARD
        ========================================= */

        .product-card {

            position: relative;

            overflow: hidden;

            background:
                rgba(255,255,255,.96);

            border:
                1px solid
                rgba(236,79,147,.12);

            border-radius: 24px;

            box-shadow:
                0 12px 40px
                rgba(54,26,40,.07);

            transition:
                transform .35s ease,
                box-shadow .35s ease,
                border-color .35s ease;
        }

        .product-card:hover {

            transform:
                translateY(-8px);

            border-color:
                rgba(236,79,147,.38);

            box-shadow:
                0 20px 55px
                rgba(236,79,147,.18);
        }

        /* =========================================
           IMAGE
        ========================================= */

        .product-card-image {

            position: relative;

            height: 290px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #fff7fa,
                    #fff
                );

            overflow: hidden;
        }

        .product-card-image img {

            width: 100%;
            height: 100%;

            object-fit: contain;

            padding: 22px;

            box-sizing: border-box;

            transition:
                transform .5s ease;
        }

        .product-card:hover
        .product-card-image img {

            transform:
                scale(1.07);
        }

        /* =========================================
           BADGE
        ========================================= */

        .product-badge {

            position: absolute;

            top: 16px;
            left: 16px;

            z-index: 2;

            padding:
                7px 12px;

            border-radius: 20px;

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #ef4f96,
                    #d92d78
                );

            font-size: 10px;

            font-weight: 800;

            letter-spacing:
                .7px;
        }

        /* =========================================
           CONTENT
        ========================================= */

        .product-card-content {

            padding:
                22px;
        }

        .product-category {

            margin-bottom: 8px;

            color:
                #e84b8f;

            font-size: 11px;

            font-weight: 800;

            text-transform:
                uppercase;

            letter-spacing:
                1px;
        }

        .product-card h3 {

            margin:
                0 0 10px;

            color:
                #2b2025;

            font-size: 17px;

            line-height: 1.45;

            min-height: 49px;
        }

        .product-rating {

            margin-bottom: 15px;

            color: #e9a72c;

            font-size: 12px;
        }

        .product-rating span {

            margin-left: 5px;

            color:
                #927c86;
        }

        .product-price {

            margin-bottom: 18px;

            color:
                #e53e87;

            font-size: 21px;

            font-weight: 800;
        }

        .product-actions {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 9px;
        }

        .product-detail-btn,
        .product-cart-btn {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            padding:
                12px 10px;

            border-radius: 12px;

            cursor: pointer;

            font-family:
                "DM Sans",
                sans-serif;

            font-size: 12px;

            font-weight: 700;

            text-decoration:
                none;

            transition: .3s ease;
        }

        .product-detail-btn {

            color:
                #e33f87;

            background:
                #fff4f8;

            border:
                1px solid
                rgba(236,79,147,.20);
        }

        .product-detail-btn:hover {

            background:
                #ec4f93;

            color: #fff;
        }

        .product-cart-btn {

            border: none;

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #ef4f96,
                    #d92d78
                );
        }

        .product-cart-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(236,79,147,.25);
        }

        /* =========================================
           EMPTY
        ========================================= */

        .products-empty {

            grid-column:
                1 / -1;

            text-align: center;

            padding: 80px 20px;

            color: #806b75;
        }

        .products-empty i {

            display: block;

            margin-bottom: 15px;

            color: #ec4f93;

            font-size: 40px;
        }

        /* =========================================
           FOOTER
        ========================================= */

        .products-footer {

            padding: 35px 20px;

            text-align: center;

            color: #fff;

            background:
                #261c21;

            font-size: 14px;
        }

        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 1100px) {

            #productGrid {

                grid-template-columns:
                    repeat(3, minmax(0,1fr));
            }
        }

        @media (max-width: 800px) {

            #productGrid {

                grid-template-columns:
                    repeat(2, minmax(0,1fr));

                gap: 16px;
            }

            .products-section {

                padding:
                    20px 15px 70px;
            }

            .product-card-image {

                height: 240px;
            }
        }

        @media (max-width: 520px) {

            #productGrid {

                grid-template-columns:
                    1fr;
            }

            .products-hero {

                padding:
                    80px 18px 40px;
            }

            .category-filter {

                justify-content:
                    flex-start;

                overflow-x: auto;

                flex-wrap: nowrap;

                padding-bottom: 8px;
            }

            .category-btn {

                flex:
                    0 0 auto;
            }

            .products-info {

                display: block;
            }
        }

    </style>

</head>


<body>

<div class="products-page">

    <!-- =========================================
         HERO
    ========================================== -->

    <section class="products-hero">

        <div class="products-eyebrow">
            DRW SKINCARE COLLECTION
        </div>

        <h1 class="products-title">
            Temukan Produk
            <span>Favoritmu</span>
        </h1>

        <p class="products-subtitle">
            Pilih rangkaian perawatan wajah,
            tubuh, rambut, dan kebutuhan
            kecantikan pilihan RARA DRW Skincare.
        </p>

    </section>


    <!-- =========================================
         SEARCH + CATEGORY
    ========================================== -->

    <section class="products-toolbar">

        <div class="products-search">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="search"
                id="productSearch"
                placeholder="Cari produk favoritmu..."
                autocomplete="off">

        </div>


        <div
            class="category-filter"
            id="categoryFilter">

            <button
                class="category-btn active"
                data-category="all">

                Semua Produk

            </button>

        </div>

    </section>


    <!-- =========================================
         PRODUCTS
    ========================================== -->

    <section class="products-section">

        <div class="products-info">

            <div>
                Menampilkan
                <strong id="productCount">
                    0
                </strong>
                produk
            </div>

        </div>


        <div id="productGrid">

            <!-- Produk akan dibuat oleh JavaScript -->

        </div>

    </section>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="products-footer">

        © 2026 RARA DRW Skincare.
        All Rights Reserved.

    </footer>

</div>


<!-- =================================================
     SCRIPT ORDER — SANGAT PENTING
================================================= -->

<!-- 1. DATABASE PRODUK -->
<script src="assets/js/product.js"></script>


<!-- 2. CART -->
<script src="assets/js/cart.js"></script>


<!-- 3. APP -->
<script src="assets/js/app.js"></script>


<!-- =================================================
     PRODUCTS PAGE RENDERER
================================================= -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const grid =
            document.getElementById(
                "productGrid"
            );

        const search =
            document.getElementById(
                "productSearch"
            );

        const categoryFilter =
            document.getElementById(
                "categoryFilter"
            );

        const productCount =
            document.getElementById(
                "productCount"
            );


        /* =========================================
           AMBIL DATABASE
        ========================================== */

        const products =
            Array.isArray(
                window.DRW_PRODUCTS
            )
                ? window.DRW_PRODUCTS
                : [];


        console.log(
            "Products Page:",
            products.length,
            "produk ditemukan"
        );


        /* =========================================
           FORMAT RUPIAH
        ========================================== */

        function rupiah(value) {

            if (
                value === null ||
                value === undefined ||
                Number.isNaN(Number(value))
            ) {
                return "Harga belum tersedia";
            }

            return new Intl.NumberFormat(
                "id-ID",
                {
                    style: "currency",
                    currency: "IDR",
                    maximumFractionDigits: 0
                }
            ).format(value);
        }


        /* =========================================
           ESCAPE HTML
        ========================================== */

        function escapeHTML(value) {

            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /* =========================================
           CATEGORY LIST
        ========================================== */

        function createCategories() {

            const categories =
                [
                    ...new Set(
                        products
                            .map(
                                product =>
                                    product.category
                            )
                            .filter(Boolean)
                    )
                ];


            categories.forEach(
                category => {

                    const button =
                        document.createElement(
                            "button"
                        );

                    button.className =
                        "category-btn";

                    button.dataset.category =
                        category;

                    button.textContent =
                        category;

                    categoryFilter.appendChild(
                        button
                    );

                }
            );

        }


        /* =========================================
           RENDER
        ========================================== */

        function renderProducts(
            list
        ) {

            grid.innerHTML = "";

            productCount.textContent =
                list.length;


            if (!list.length) {

                grid.innerHTML = `

                    <div class="products-empty">

                        <i class="fa-solid fa-box-open"></i>

                        <strong>
                            Produk tidak ditemukan
                        </strong>

                        <p>
                            Coba gunakan kata pencarian lain.
                        </p>

                    </div>

                `;

                return;
            }


            list.forEach(
                product => {

                    const card =
                        document.createElement(
                            "article"
                        );

                    card.className =
                        "product-card";


                    const image =
                        product.image ||
                        "assets/images/placeholder.png";


                    const price =
                        rupiah(
                            product.price
                        );


                    card.innerHTML = `

                        <div class="product-card-image">

                            <div class="product-badge">
                                ${escapeHTML(
                                    product.badge ||
                                    "DRW SKINCARE"
                                )}
                            </div>

                            <img
                                src="${escapeHTML(image)}"
                                alt="${escapeHTML(product.name)}"
                                loading="lazy"
                                onerror="
                                    this.onerror=null;
                                    this.src='assets/images/placeholder.png';
                                "
                            >

                        </div>


                        <div class="product-card-content">

                            <div class="product-category">
                                ${escapeHTML(
                                    product.category ||
                                    "Perawatan Wajah"
                                )}
                            </div>


                            <h3>
                                ${escapeHTML(
                                    product.name
                                )}
                            </h3>


                            <div class="product-rating">

                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>

                                <span>
                                    ${product.rating || 4.9}
                                    (${product.reviews || 128})
                                </span>

                            </div>


                            <div class="product-price">
                                ${price}
                            </div>


                            <div class="product-actions">

                                <a
                                    class="product-detail-btn"
                                    href="product.html?id=${encodeURIComponent(product.id)}">

                                    <i class="fa-regular fa-eye"></i>

                                    Detail

                                </a>


                                <button
                                    class="product-cart-btn"
                                    type="button"
                                    data-product-id="${escapeHTML(product.id)}">

                                    <i class="fa-solid fa-bag-shopping"></i>

                                    Keranjang

                                </button>

                            </div>

                        </div>

                    `;


                    grid.appendChild(card);

                }
            );

        }


        /* =========================================
           FILTER
        ========================================== */

        let activeCategory =
            "all";


        function applyFilter() {

            const keyword =
                (
                    search.value || ""
                )
                    .toLowerCase()
                    .trim();


            const filtered =
                products.filter(
                    product => {

                        const matchesSearch =
                            !keyword ||
                            (
                                product.name || ""
                            )
                                .toLowerCase()
                                .includes(
                                    keyword
                                );


                        const matchesCategory =
                            activeCategory === "all" ||
                            product.category ===
                                activeCategory;


                        return (
                            matchesSearch &&
                            matchesCategory
                        );

                    }
                );


            renderProducts(
                filtered
            );

        }


        /* =========================================
           SEARCH
        ========================================== */

        search.addEventListener(
            "input",
            applyFilter
        );


        /* =========================================
           CATEGORY CLICK
        ========================================== */

        categoryFilter.addEventListener(
            "click",
            function (event) {

                const button =
                    event.target.closest(
                        ".category-btn"
                    );


                if (!button) {
                    return;
                }


                document
                    .querySelectorAll(
                        ".category-btn"
                    )
                    .forEach(
                        btn =>
                            btn.classList.remove(
                                "active"
                            )
                    );


                button.classList.add(
                    "active"
                );


                activeCategory =
                    button.dataset.category ||
                    "all";


                applyFilter();

            }
        );


        /* =========================================
           ADD TO CART
        ========================================== */

        grid.addEventListener(
            "click",
            function (event) {

                const button =
                    event.target.closest(
                        ".product-cart-btn"
                    );


                if (!button) {
                    return;
                }


                const productId =
                    button.dataset.productId;


                const product =
                    products.find(
                        item =>
                            String(item.id) ===
                            String(productId)
                    );


                if (!product) {

                    console.error(
                        "Produk tidak ditemukan:",
                        productId
                    );

                    return;
                }


                console.log(
                    "Tambah ke keranjang:",
                    product
                );


                /*
                   Gunakan fungsi cart.js jika tersedia.
                   Tidak memaksa fungsi tertentu
                   agar kompatibel dengan CART V7.
                */

                if (
                    typeof window.addToCart ===
                    "function"
                ) {

                    window.addToCart(
                        product,
                        1
                    );

                } else {

                    /*
                       Fallback localStorage.
                    */

                    let cart = [];

                    try {

                        cart =
                            JSON.parse(
                                localStorage.getItem(
                                    "drwCart"
                                )
                            ) || [];

                    } catch (error) {

                        cart = [];

                    }


                    const existing =
                        cart.find(
                            item =>
                                String(
                                    item.id
                                ) ===
                                String(
                                    product.id
                                )
                        );


                    if (existing) {

                        existing.qty =
                            Number(
                                existing.qty || 0
                            ) + 1;

                        existing.quantity =
                            existing.qty;

                    } else {

                        cart.push({

                            ...product,

                            qty: 1,

                            quantity: 1

                        });

                    }


                    localStorage.setItem(
                        "drwCart",
                        JSON.stringify(
                            cart
                        )
                    );

                }


                button.innerHTML =
                    `
                    <i class="fa-solid fa-check"></i>
                    Ditambahkan
                    `;


                setTimeout(
                    function () {

                        button.innerHTML =
                            `
                            <i class="fa-solid fa-bag-shopping"></i>
                            Keranjang
                            `;

                    },
                    1200
                );

            }
        );


        /* =========================================
           START
        ========================================== */

        createCategories();

        renderProducts(
            products
        );

    }
);

</script>

</body>

</html>
