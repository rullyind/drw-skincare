        }

        }

            padding:

            border-radius: 30px;

            background:
                #fff;

            color:
                #6e5360;

            border:

            font-family:
                "DM Sans",

            font-size: 13px;
            font-weight: 700;

            transition: .3s ease;

        .category-btn:hover,
        .category-btn.active {

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #ef4f96,
                    #d92d78

            border-color:
                transparent;

            transform:
                translateY(-2px);
        }

           PRODUCT AREA
        ========================================= */

            max-width: 1400px;

            margin: 0 auto;

            padding:
                20px 30px 100px;
        }

        .products-info {

            display: flex;

            justify-content:

            align-items: center;

            margin-bottom: 25px;

            color: #806b75;

            font-size: 14px;
        }

        #productCount {

            font-weight: 700;

            color: #ec4f93;
        }

        /* =========================================
           PRODUCT GRID
        ========================================= */

        #productGrid {

            display: grid;

            grid-template-columns:
                repeat(

                    minmax(0, 1fr)
                );

            gap: 26px;
        }

           PRODUCT CARD
        ========================================= */

        .product-card {

            position: relative;

            overflow: hidden;

            background:
                rgba(255,255,255,.96);

            border:
                1px solid
                rgba(236,79,147,.12);

            border-radius: 24px;

            box-shadow:
                0 12px 40px
                rgba(54,26,40,.07);

            transition:
                transform .35s ease,
                box-shadow .35s ease,
                border-color .35s ease;
        }

        .product-card:hover {

            transform:
                translateY(-8px);

            border-color:
                rgba(236,79,147,.38);

            box-shadow:
                0 20px 55px
                rgba(236,79,147,.18);
        }

           IMAGE
        ========================================= */

        .product-card-image {

            height: 290px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #fff7fa,
                    #fff
                );

        }

            width: 100%;
            height: 100%;

            object-fit: contain;

            padding: 22px;

            box-sizing: border-box;

            transition:
                transform .5s ease;
        }

        .product-card:hover
        .product-card-image img {

            transform:
                scale(1.07);
        }

           BADGE

                    #d92d78

            font-weight: 800;

            letter-spacing:

           CONTENT
        ========================================= */

            padding:
                22px;
        }

            color:

            font-size: 11px;

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const grid =
            document.getElementById(
                "productGrid"
            );

        const search =
            document.getElementById(
                "productSearch"
            );

        const categoryFilter =
            document.getElementById(
                "categoryFilter"
            );

        const productCount =
            document.getElementById(
                "productCount"
            );


        /* =========================================
           AMBIL DATABASE
        ========================================== */

        const rawProducts = window.DRW_PRODUCTS;

        const products = Array.isArray(rawProducts)
            ? rawProducts
            : rawProducts && typeof rawProducts === "object"
                ? Object.values(rawProducts)
                : [];


        console.log(
            "DRW PRODUCTS:",
            products.length,
            "produk ditemukan"
        );

        if (!products.length) {
            console.error(
                "DRW SKINCARE: window.DRW_PRODUCTS kosong. " +
                "Pastikan assets/js/products-data.js berhasil dimuat."
            );
        }


        /* =========================================
           FORMAT RUPIAH
        ========================================== */

        function rupiah(value) {

            if (
                value === null ||
                value === undefined ||
                Number.isNaN(Number(value))
            ) {
                return "Harga belum tersedia";
            }

            return new Intl.NumberFormat(
                "id-ID",
                {
                    style: "currency",
                    currency: "IDR",
                    maximumFractionDigits: 0
                }
            ).format(value);
        }


        /* =========================================
           ESCAPE HTML
        ========================================== */

        function escapeHTML(value) {

            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /* =========================================
           CATEGORY LIST
        ========================================== */

        function createCategories() {

            const categories =
                [
                    ...new Set(
                        products
                            .map(
                                product =>
                                    product.category
                            )
                            .filter(Boolean)
                    )
                ];


            categories.forEach(
                category => {

                    const button =
                        document.createElement(
                            "button"
                        );

                    button.className =
                        "category-btn";

                    button.dataset.category =
                        category;

                    button.textContent =
                        category;

                    categoryFilter.appendChild(
                        button
                    );

                }
            );

        }


        /* =========================================
           RENDER
        ========================================== */

        function renderProducts(
            list
        ) {

            grid.innerHTML = "";

            productCount.textContent =
                list.length;


            if (!list.length) {

                grid.innerHTML = `

                    <div class="products-empty">

                        <i class="fa-solid fa-box-open"></i>

                        <strong>
                            Produk tidak ditemukan
                        </strong>

                        <p>
                            Coba gunakan kata pencarian lain.
                        </p>

                    </div>

                `;

                return;
            }


            list.forEach(
                product => {

                    const card =
                        document.createElement(
                            "article"
                        );

                    card.className =
                        "product-card";


                    const image =
                        product.image ||
                        product.imageUrl ||
                        "assets/images/placeholder.png";

                    const productId =
                        product.id ||
                        product.slug ||
                        product.name ||
                        "";


                    const price =
                        rupiah(
                            product.price
                        );


                    card.innerHTML = `

                        <div class="product-card-image">

                            <div class="product-badge">
                                ${escapeHTML(
                                    product.badge ||
                                    "DRW SKINCARE"
                                )}
                            </div>

                            <img
                                src="${escapeHTML(image)}"
                                alt="${escapeHTML(product.name)}"
                                loading="lazy"
                                onerror="
                                    this.onerror=null;
                                    this.src='assets/images/placeholder.png';
                                "
                            >

                        </div>


                        <div class="product-card-content">

                            <div class="product-category">
                                ${escapeHTML(
                                    product.category ||
                                    "Perawatan Wajah"
                                )}
                            </div>


                            <h3>
                                ${escapeHTML(
                                    product.name
                                )}
                            </h3>


                            <div class="product-rating">

                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>

                                <span>
                                    ${product.rating || 4.9}
                                    (${product.reviews || 128})
                                </span>

                            </div>


                            <div class="product-price">
                                ${price}
                            </div>


                            <div class="product-actions">

                                <a
                                   class="product-detail-btn"
                                  href="product-detail.html?id=${encodeURIComponent(productId)}">

                                    <i class="fa-regular fa-eye"></i>
                                    Detail
                                </a>


                                <button
                                    class="product-cart-btn"
                                    type="button"
                                    data-product-id="${escapeHTML(productId)}">

                                    <i class="fa-solid fa-bag-shopping"></i>

                                    Keranjang

                                </button>

                            </div>

                        </div>

                    `;


                    grid.appendChild(card);

                }
            );

        }


        /* =========================================
           FILTER
        ========================================== */

        let activeCategory =
            "all";


        function applyFilter() {

            const keyword =
                (
                    search.value || ""
                )
                    .toLowerCase()
                    .trim();


            const filtered =
                products.filter(
                    product => {

                        const searchableText = [product.name, product.category, product.description, product.badge]
                            .filter(Boolean).join(" ").toLowerCase();

                        const matchesSearch = !keyword || searchableText.includes(keyword);


                        const matchesCategory =
                            activeCategory === "all" ||
                            product.category ===
                                activeCategory;


                        return (
                            matchesSearch &&
                            matchesCategory
                        );

                    }
                );


            renderProducts(
                filtered
            );

        }


        /* =========================================
           SEARCH
        ========================================== */

        search.addEventListener(
            "input",
            applyFilter
        );


        /* =========================================
           CATEGORY CLICK
        ========================================== */

        categoryFilter.addEventListener(
            "click",
            function (event) {

                const button =
                    event.target.closest(
                        ".category-btn"
                    );


                if (!button) {
                    return;
                }


                document
                    .querySelectorAll(
                        ".category-btn"
                    )
                    .forEach(
                        btn =>
                            btn.classList.remove(
                                "active"
                            )
                    );


                button.classList.add(
                    "active"
                );


                activeCategory =
                    button.dataset.category ||
                    "all";


                applyFilter();

            }
        );


        /* =========================================
           ADD TO CART
        ========================================== */

        grid.addEventListener(
            "click",
            function (event) {

                const button =
                    event.target.closest(
                        ".product-cart-btn"
                    );


                if (!button) {
                    return;
                }


                const productId =
                    button.dataset.productId;


                const product =
                    products.find(
                        item =>
                            String(item.id) ===
                            String(productId)
                    );


                if (!product) {

                    console.error(
                        "Produk tidak ditemukan:",
                        productId
                    );

                    return;
                }


                console.log(
                    "Tambah ke keranjang:",
                    product
                );


                /*
                   Gunakan fungsi cart.js jika tersedia.
                   Tidak memaksa fungsi tertentu
                   agar kompatibel dengan CART V7.
                */

                if (
                    typeof window.addToCart ===
                    "function"
                ) {

                    window.addToCart(
                        product,
                        1
                    );

                } else {

                    /*
                       Fallback localStorage.
                    */

                    let cart = [];

                    try {

                        cart =
                            JSON.parse(
                                localStorage.getItem(
                                    "drwCart"
                                )
                            ) || [];

                    } catch (error) {

                        cart = [];

                    }


                    const existing =
                        cart.find(
                            item =>
                                String(
                                    item.id
                                ) ===
                                String(
                                    product.id
                                )
                        );


                    if (existing) {

                        existing.qty =
                            Number(
                                existing.qty || 0
                            ) + 1;

                        existing.quantity =
                            existing.qty;

                    } else {

                        cart.push({

                            ...product,

                            qty: 1,

                            quantity: 1

                        });

                    }


                    localStorage.setItem(
                        "drwCart",
                        JSON.stringify(
                            cart
                        )
                    );

                }


                button.innerHTML =
                    `
                    <i class="fa-solid fa-check"></i>
                    Ditambahkan
                    `;


                setTimeout(
                    function () {

                        button.innerHTML =
                            `
                            <i class="fa-solid fa-bag-shopping"></i>
                            Keranjang
                            `;

                    },
                    1200
                );

            }
        );


        /* =========================================
           START
        ========================================== */

        createCategories();

        renderProducts(
            products
        );

    }
);

</script>
