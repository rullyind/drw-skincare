<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Daftar | RARA DRW Skincare</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >


    <style>

        /* =========================================
           REGISTER PAGE
        ========================================= */

        .auth-page {

            min-height: calc(100vh - 120px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 60px 20px;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255,105,170,.15),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(255,214,232,.45),
                    transparent 35%
                ),
                #fffafd;

        }


        .auth-card {

            width: 100%;

            max-width: 500px;

            background: rgba(255,255,255,.97);

            border: 1px solid rgba(238,79,145,.18);

            border-radius: 28px;

            padding: 40px;

            box-shadow:
                0 20px 60px rgba(0,0,0,.10),
                0 0 35px rgba(238,79,145,.08);

        }


        .auth-logo {

            text-align: center;

            margin-bottom: 22px;

        }


        .auth-logo img {

            width: 180px;

            max-width: 80%;

        }


        .auth-title {

            text-align: center;

            font-family: "Playfair Display", serif;

            font-size: 32px;

            margin: 0 0 8px;

        }


        .auth-subtitle {

            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 28px;

        }


        .auth-field {

            margin-bottom: 16px;

        }


        .auth-field label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 700;

            color: #241923;

        }


        .auth-input {

            width: 100%;

            height: 48px;

            box-sizing: border-box;

            border-radius: 13px;

            border: 1px solid #ead9e2;

            padding: 0 15px;

            font-family: "DM Sans", sans-serif;

            outline: none;

            transition: .25s ease;

        }


        .auth-input:focus {

            border-color: #e84f91;

            box-shadow:
                0 0 0 4px rgba(232,79,145,.10);

        }


        .auth-button {

            width: 100%;

            height: 52px;

            margin-top: 8px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #ec4f91,
                    #d9367b
                );

            color: white;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(217,54,123,.25);

            transition: .25s ease;

        }


        .auth-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 14px 32px rgba(217,54,123,.35);

        }


        .auth-message {

            display: none;

            margin-bottom: 16px;

            padding: 12px 14px;

            border-radius: 12px;

            font-size: 13px;

        }


        .auth-message.error {

            display: block;

            background: #fff0f4;

            color: #c72f68;

        }


        .auth-message.success {

            display: block;

            background: #f1fff8;

            color: #25805b;

        }


        .auth-login {

            text-align: center;

            margin-top: 23px;

            color: #777;

            font-size: 14px;

        }


        .auth-login a {

            color: #e84f91;

            font-weight: 700;

            text-decoration: none;

        }


        @media(max-width:600px) {

            .auth-card {

                padding: 28px 20px;

            }

        }

    </style>

</head>


<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-logo">

                <a href="index.html">

                    <img
                        src="assets/images/logo/logo.png"
                        alt="RARA DRW Skincare"
                    >

                </a>

            </div>


            <h1 class="auth-title">
                Buat Akun
            </h1>


            <p class="auth-subtitle">
                Daftar untuk mendapatkan pengalaman belanja terbaik
            </p>


            <div
                id="authMessage"
                class="auth-message"
            ></div>


            <form id="registerForm">

                <div class="auth-field">

                    <label for="registerName">
                        Nama Lengkap
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        class="auth-input"
                        placeholder="Nama lengkap"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        class="auth-input"
                        placeholder="Email aktif"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="registerPhone">
                        Nomor WhatsApp
                    </label>

                    <input
                        type="tel"
                        id="registerPhone"
                        class="auth-input"
                        placeholder="08xxxxxxxxxx"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        class="auth-input"
                        placeholder="Minimal 6 karakter"
                        minlength="6"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="registerPasswordConfirm">
                        Konfirmasi Password
                    </label>

                    <input
                        type="password"
                        id="registerPasswordConfirm"
                        class="auth-input"
                        placeholder="Ulangi password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >

                    <i class="fa-solid fa-user-plus"></i>

                    &nbsp; Daftar Sekarang

                </button>

            </form>


            <div class="auth-login">

                Sudah punya akun?

                <a href="login.html">
                    Login
                </a>

            </div>

        </section>

    </main>


    <script src="assets/js/auth.js"></script>


    
</body>

</html>
