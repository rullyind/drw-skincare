<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Daftar | DRW Skincare</title>

    <link
        rel="icon"
        href="assets/images/favicon.png">

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff7fb,
                    #ffe8f4,
                    #fff
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .auth-card {

            width: 100%;

            max-width: 430px;

            background: rgba(
                255,
                255,
                255,
                0.96
            );

            border-radius: 28px;

            padding: 40px 32px;

            box-shadow:
                0 20px 60px
                rgba(230, 55, 140, 0.18);

            border:
                1px solid
                rgba(230, 55, 140, 0.12);

        }


        .brand {

            text-align: center;

            color: #e73591;

            font-weight: 700;

            letter-spacing: 3px;

            font-size: 14px;

            margin-bottom: 10px;

        }


        h1 {

            text-align: center;

            margin:
                0 0 8px;

            color: #422033;

            font-family:
                Georgia,
                serif;

        }


        .subtitle {

            text-align: center;

            color: #8b6878;

            margin-bottom: 25px;

        }


        .form-group {

            margin-bottom: 15px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            color: #54283f;

            font-weight: 600;

            font-size: 14px;

        }


        input {

            width: 100%;

            padding: 14px 16px;

            border-radius: 14px;

            border:
                1px solid
                #ecc8d9;

            outline: none;

            font-size: 15px;

        }


        input:focus {

            border-color:
                #e73591;

            box-shadow:
                0 0 0 4px
                rgba(231, 53, 145, 0.10);

        }


        button {

            width: 100%;

            border: 0;

            padding: 15px;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #e73591,
                    #d92b80
                );

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;

        }


        .auth-message {

            display: none;

            margin-bottom: 18px;

            padding: 12px 14px;

            border-radius: 12px;

            font-size: 14px;

            text-align: center;

        }


        .auth-message.error {

            display: block;

            background: #fff0f3;

            color: #b42345;

        }


        .auth-message.success {

            display: block;

            background: #edfff5;

            color: #087443;

        }


        .switch {

            text-align: center;

            margin-top: 22px;

            color: #795a69;

            font-size: 14px;

        }


        .switch a {

            color: #e73591;

            font-weight: 700;

            text-decoration: none;

        }

    </style>

</head>


<body>


    <main class="auth-card">

        <div class="brand">
            ✦ DRW SKINCARE ✦
        </div>


        <h1>
            Buat Akun
        </h1>


        <div class="subtitle">
            Daftar untuk mulai berbelanja
        </div>


        <div
            id="auth-message"
            class="auth-message">
        </div>


        <form id="register-form">

            <div class="form-group">

                <label for="register-name">
                    Nama Lengkap
                </label>

                <input
                    type="text"
                    id="register-name"
                    placeholder="Nama lengkap"
                    autocomplete="name"
                    required>

            </div>


            <div class="form-group">

                <label for="register-email">
                    Email
                </label>

                <input
                    type="email"
                    id="register-email"
                    placeholder="Email Anda"
                    autocomplete="email"
                    required>

            </div>


            <div class="form-group">

                <label for="register-password">
                    Password
                </label>

                <input
                    type="password"
                    id="register-password"
                    placeholder="Minimal 6 karakter"
                    autocomplete="new-password"
                    minlength="6"
                    required>

            </div>


            <div class="form-group">

                <label for="register-confirm-password">
                    Konfirmasi Password
                </label>

                <input
                    type="password"
                    id="register-confirm-password"
                    placeholder="Ulangi password"
                    autocomplete="new-password"
                    minlength="6"
                    required>

            </div>


            <button type="submit">
                Daftar Sekarang
            </button>

        </form>


        <div class="switch">

            Sudah punya akun?

            <a href="login.html">
                Login
            </a>

        </div>


    </main>


    <script
        type="module"
        src="assets/js/auth.js">
    </script>

<script type="module" src="assets/js/register.js"></script>
</body>

</html>
